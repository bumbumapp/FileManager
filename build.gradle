buildscript {
    ext {
        compileSdkVersion = 36
        minSdkVersion = 26
        targetSdkVersion = 36

        activity_version = '1.11.0'
        appintro_version = '6.3.1'
        argon2_version = '1.6.0'
        appcompat_version = '1.7.1'
        biometric_version = '1.1.0'
        cardview_version = '1.0.0'
        constraintlayout_version = '2.2.1'
        coroutines_version = '1.10.2'
        documentfile_version = '1.1.0'
        exifinterface_version = '1.4.1'
        fragment_version = '1.8.9'
        glide_version = '4.16.0'
        kotlin_version = '2.2.21'
        ktx_version = '1.17.0'
        lifecycle_version = '2.9.4'
        material_version = '1.13.0'
        preference_version = '1.2.1'
        recyclerview_version = '1.4.0'
        security_crypto_version = '1.1.0'
        swiperefreshlayout_version = '1.1.0'
        taptargetview_version = '1.15.0'
        zip4j_version = '2.11.5'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // AppIntro is only published on JitPack.
        maven {
            url "https://jitpack.io"
            content { includeGroup "com.github.AppIntro" }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
