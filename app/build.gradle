apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'


// Huawei Ads (Petal) slot IDs for the AppGallery (hms) build; override with -PHMS_BANNER_ID=... or a
// gitignored ads.properties. Debug builds always use Huawei's public test slots.
def adsProps = new Properties()
def adsFile = rootProject.file('ads.properties')
if (adsFile.exists()) adsFile.withInputStream { adsProps.load(it) }
def adId = { String key, String fallback -> ((project.findProperty(key) ?: adsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = adId('HMS_BANNER_ID', 'w0rc6qmydt')
def HMS_INTERSTITIAL_ID = adId('HMS_INTERSTITIAL_ID', 'e1fjyvnnts')

android {
    namespace 'com.securefilemanager.app'
    compileSdk rootProject.compileSdkVersion

    defaultConfig {
        applicationId "com.bumbumapps.filemanager"
        minSdk rootProject.minSdkVersion
        targetSdk rootProject.targetSdkVersion
        setProperty("archivesBaseName", "filemanager")
        // AppGallery build: must exceed the live AppGallery versionCode.
        versionCode 5
        versionName "1.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // play = Google Play (no ads), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildFeatures {
        resValues true
        buildConfig true
    }
    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "androidx.activity:activity-ktx:$activity_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.biometric:biometric:$biometric_version"
    implementation "androidx.cardview:cardview:$cardview_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation "androidx.core:core-ktx:$ktx_version"
    implementation "androidx.documentfile:documentfile:$documentfile_version"
    implementation "androidx.exifinterface:exifinterface:$exifinterface_version"
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.preference:preference-ktx:$preference_version"
    implementation "androidx.recyclerview:recyclerview:$recyclerview_version"
    implementation "androidx.security:security-crypto:$security_crypto_version"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swiperefreshlayout_version"

    implementation "com.google.android.material:material:$material_version"

    implementation "com.github.AppIntro:AppIntro:$appintro_version"
    implementation "com.lambdapioneer.argon2kt:argon2kt:$argon2_version"
    implementation "com.getkeepsafe.taptargetview:taptargetview:$taptargetview_version"
    implementation "net.lingala.zip4j:zip4j:$zip4j_version"

    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    testImplementation 'junit:junit:4.13.2'
}
